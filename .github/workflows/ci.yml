name: CI

# Test 64-bit and 32-bit Linux and 32-bit Windows. Cross-compile Windows
# tests on Linux, then run them on Windows and Wine.
#
# Run automatically for repositories owned by willox or auxtools. Other forks
# can start a run through Actions > CI > Run workflow.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.99.1

jobs:
  test-linux:
    name: Linux, ${{ matrix.target }}
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'willox' || github.repository_owner == 'auxtools'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, i686-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the 32-bit compiler
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --target "${{ matrix.target }}" --no-self-update
          rustup default "$RUST_VERSION"

      - name: Check the formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all -- --check

      - name: Restore downloaded crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: crates-${{ hashFiles('Cargo.lock') }}
          restore-keys: crates-

      - name: Test
        run: cargo test --locked --all-features --target "${{ matrix.target }}"

      - name: Build without the features
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo check --locked --all-targets

  build-windows:
    name: Build the tests for Windows
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'willox' || github.repository_owner == 'auxtools'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET: i686-pc-windows-msvc
      MSVC_SDK: ${{ github.workspace }}/.msvc-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install LLVM's linker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET" --no-self-update
          rustup default "$RUST_VERSION"

      - name: Restore downloaded crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: crates-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: crates-windows-

      - name: Restore the Windows SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .msvc-sdk
          key: msvc-sdk-${{ hashFiles('ci/msvc/fetch-sdk.sh') }}

      - name: Fetch the Windows SDK
        run: ci/msvc/fetch-sdk.sh "$MSVC_SDK"

      - name: Build the tests
        run: |
          . ci/msvc/env.sh
          ci/build-tests.sh tests-windows --locked --all-features --target "$TARGET"

      - name: Upload the tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-windows
          path: tests-windows
          if-no-files-found: error
          retention-days: 1

  test-windows:
    name: ${{ matrix.name }}
    needs: build-windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test on Server 2022 (Windows 10 generation).
          - name: Windows
            runner: windows-2022
          # Use Wine 10.0.
          - name: Wine
            runner: ubuntu-26.04
            wine: wine
    defaults:
      run:
        shell: bash
    env:
      WINE: ${{ matrix.wine }}
      WINEARCH: win32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Wine
        if: matrix.wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32:i386
          wine --version

      - name: Download the tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-windows
          path: tests-windows

      - name: Test
        run: ci/run-tests.sh tests-windows
